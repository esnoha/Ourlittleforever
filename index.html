
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Together With Us ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe4ec, #ffc2d8, #fff0f5);
    font-family: Georgia, serif;
    text-align: center;
    color: #e75480;
}

.card {
    background: rgba(255,255,255,0.85);
    padding: 45px 25px;
    border-radius: 25px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 10px 35px rgba(231,84,128,0.15);
    animation: appear 1.5s ease;
}

.heart {
    font-size: 55px;
    animation: heartbeat 1.3s infinite;
}

h1 {
    font-size: 2rem;
    margin: 25px 0;
    line-height: 1.4;
}

.subtitle {
    color: #b85b7c;
    font-size: 1rem;
    margin: 25px 0 15px;
}

.counter {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.time-box {
    background: #fff0f5;
    padding: 18px 5px;
    border-radius: 15px;
}

.number {
    font-size: 2rem;
    font-weight: bold;
}

.unit {
    font-size: 0.75rem;
    margin-top: 5px;
    letter-spacing: 1px;
}

.footer {
    margin-top: 25px;
    font-size: 1rem;
    color: #d66a91;
    font-style: italic;
}

@keyframes heartbeat {
    50% { transform: scale(1.15); }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>We love each other since</h1>

    <div class="subtitle">
        September 10, 2023
    </div>

    <div class="counter">

        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="unit">DAYS</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="unit">HOURS</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="unit">MINUTES</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="unit">SECONDS</div>
        </div>

    </div>

    <div class="footer">
        Always yours -bebii ❤️
    </div>

</div>

<script>
const anniversary = new Date("2023-09-10T00:00:00+08:00");

function updateCounter() {
    const now = new Date();
    let difference = Math.max(0, now - anniversary);

    const days = Math.floor(difference / 86400000);
    difference %= 86400000;

    const hours = Math.floor(difference / 3600000);
    difference %= 3600000;

    const minutes = Math.floor(difference / 60000);
    difference %= 60000;

    const seconds = Math.floor(difference / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCounter();
setInterval(updateCounter, 1000);
</script>

</body>
</html>
